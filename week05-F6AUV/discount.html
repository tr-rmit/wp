<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discount Calculator</title>
</head>
<body>
  <h1>Discount Calculator</h1>
  <form>
    <label for="originalPrice">Original price:</label>
    <input type="number" id="originalPrice" min="0" step="0.01">
    <label for="discountPercent">Discount percentage:</label>
    <input type="number" id="discountPercent" min="0" max="100" step="1">
    <button type="button" id="calculateDiscount">Calculate</button>
  </form>
  <div id="discountResult"></div>
  <script src="js/discount.js"></script>
</body>
</html>
