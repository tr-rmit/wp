<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Book</title>
  <!-- Latest compiled and minified CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Latest compiled JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>
  <header class="container-fluid p-3">
    <div class="row">
      <img class='col-sm-6 col-md-4' src="assets/images/mmmm-clean-flat-logo.png" alt="MMMM Logo" />
      <div class="col-sm-6 col-md-8 text-center my-auto">
        <h1>Welcome to the M.M.M.M.</h1>
        <p>Best place for merch!</p>
      </div>
    </div>
  </header>
  <nav class="navbar navbar-expand-sm py-0">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link " href="index.html">Home</a>
      </li>
      <li class="nav-item">
        <a class="nav-link " href="merch.html">Merch</a>
      </li>
      <li class="nav-item">
        <a class="nav-link " href="gallery.html">Gallery</a>
      </li>
      <li class="nav-item">
        <a class="nav-link active" href="add.html">Add Merch</a>
      </li>
    </ul>
  </nav>
  <main class="container-fluid">
    <div class="row p-3">
      <h1>Add Merch</h1>
      <form id="uploadForm" action="https://titan.csit.rmit.edu.au/~e54061/wp-he/form-processing.php" method="post" enctype="multipart/form-data">
        <div class="mb-3 mt-3">
          <label for="title" class="form-label">Title</label>
          <input type="text" name="title" id="title" class="form-control w-100" required>
        </div>
        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea rows="3" cols="50" name="description" id="description" class="form-control w-100" required></textarea>
        </div>
        <div class="mb-3">
          <label for="feature" class="form-label">Feature</label>
          <textarea rows="3" cols="50" name="feature" id="feature" class="form-control w-100" required></textarea>
        </div>
        <div class="mb-3">
          <label for="material" class="form-label">Material</label>
          <textarea rows="3" cols="50" name="material" id="material" class="form-control w-100" required></textarea>
        </div>
        <div class="mb-3">
          <label for="material" class="form-label">Price</label>
          <div class="input-group">                  
            <div class="input-group-prepend">
              <span class="input-group-text">$</span>
            </div>
            <input type="number" name="price" id="price" required class="form-control" aria-label="Amount (to the nearest dollar)">
            <div class="input-group-append">
              <span class="input-group-text">.00</span>
            </div>
          </div>
        </div>
        <div class="mb-3">
          <label for="status" class="form-label">Status</label>
          <select name="status" id="status" required class="form-control w-100">
            <option>Please Select</option>
            <option value="in-stock">In Stock</option>
            <option value="on-order">On Order</option>
            <option value="sold-out">Sold Out</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="picture" class="form-label">Picture</label>
          <input type="file" name="picture" id="picture" class="form-control w-100">
        </div>
        <!-- Bootstrap-styled hidden error message -->
        <div id="error-message" class="alert alert-danger mt-2 d-none" role="alert">You did a bad thing!</div>
        <div class="mb-3">
          <input type=submit value="Add New Merch" class="btn btn-primary">
        </div>
      </form>
    </div>
  </main>
  <footer class="container-fluid page-footer font-small">
    <div class="footer-copyright text-center py-3">
      &copy; 2025 Trevor
    </div>
  </footer>
  <script src="assets/js/main.js"></script>
</body>

</html>
